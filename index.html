<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* Prevents scrolling */
            background-color: black; /* Optional: background color */
        }

        .fullscreen-image {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Use 'cover' if you want it to fill the screen without borders */
        }
    </style>
</head>
<body>

    <img src="image.png" alt="Fullscreen PNG" class="fullscreen-image">

</body>
</html>
