<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>New Tab</title>

<style>
body{
margin:0;
font-family:sans-serif;
background:#f4f4f4;
}

/* 🔴 Notification Bar */
#notificationBar{
position:fixed;
top:-60px;
left:0;
width:100%;
background:#ffcccc;
color:#990000;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 2px 5px rgba(0,0,0,0.2);
transition:top 0.4s ease;
z-index:9999;
}

#notificationBar.show{
top:0;
}

#closeNotif{
cursor:pointer;
font-weight:bold;
margin-right:20px;
}

/* Existing styles */
#boredContainer{
position:absolute;
top:0;
left:0;
right:0;
bottom:0;
background:#fff;
overflow-y:auto;
padding:20px;
}

#boredContainer ul{
list-style:none;
padding:0;
margin:0;
}

#boredContainer li{
padding:10px;
border-bottom:1px solid #eee;
cursor:pointer;
color:#007BFF;
font-size:18px;
}

#boredContainer li:hover{
background:#f0f0f0;
}

.backButton{
font-size:20px;
color:#007BFF;
cursor:pointer;
margin-bottom:15px;
display:inline-block;
}
</style>
</head>

<body>

<!-- 🔴 Notification -->
<div id="notificationBar">
<span>ALERT: A new game has been added, Time Shooter 2! Polytrack also got a rework and is back on the site! Next project will be to get a working version of Push Your Luck.</span>
<span id="closeNotif">✖</span>
</div>

<div id="boredContainer"></div>

<script>

const boredContainer = document.getElementById("boredContainer")
let gameOpen=false

/* 🔴 Notification logic */
const notif = document.getElementById("notificationBar")
const closeNotif = document.getElementById("closeNotif")

window.onload = () => {
setTimeout(() => {
notif.classList.add("show")
}, 300)
}

closeNotif.onclick = () => {
notif.classList.remove("show")
}

/* ===== GAME LIST ===== */

const boredLinks=[

{title:"Cookie Clicker",url:"https://goatedcoder360.github.io/cookieclicker/"},

{title:"PolyTrack",url:"https://joe-the-chicken.github.io/polytrack/"},

{title:"Slope",url:"https://hello1405.github.io/slope/"},

{title:"Chrome Dino",url:"https://games-site.github.io/projects/chrome-dino/index.html"},

{title:"Tunnel Rush",url:"https://3kh0s.github.io/games/tunnelrush/index.html"},

{title:"Time Shooter 2",url:"https://eagx.github.io/TS2/"},
{title:"Subway Surfers",url:"https://hello1405.github.io/subway-surfers-ny/"},
{title:".io Games",isCategory:"io"},
{title:"Pandemic 2",url:"https://goatedcoder360.github.io/pandemic2/"},
{title:"Stack",url:"https://1kh0.github.io/projects/stack/index.html"},
{title:"Random Games",isCategory:"random"},
{title:"Tomb of the Mask",url:"https://goatedcoder360.github.io/tombofthemask/"},
{title:"Brain Games",isCategory:"brain"},
{title:"Flappy Bird",url:"https://1kh0.github.io/projects/flappy-bird/index.html"},
{title:"Death Run 3D",url:"https://games-site.github.io/projects/death-run-3d/index.html"},
{title:"Idle Breakout",url:"https://games-site.github.io/projects/idle-breakout/frame.html"},
{title:"Papa's Games",isCategory:"papas"},
{title:"The Final Earth",url:"https://1kh0.github.io/projects/the-final-earth/index.html"},
{title:"Card Games",isCategory:"cards"},
{title:"SoFlo Wheelie Life",url:"https://scratch.mit.edu/projects/1226052197/embed"},
{title:"Sound Buttons",isCategory:"sounds"},
{title:"Apps",isCategory:"apps"}

]

const ioGames=[
{title:"Paper.io",url:"https://1kh0.github.io/projects/paperio2/index.html"},
{title:"YoHoHo.io",url:"https://3kh0s.github.io/games/yohoho/index.html"},
{title:"Hexanaut.io",url:"https://hexanaut.io/"},

]

const papasGames=[
{title:"Papas Wingeria",url:"https://ubg89.github.io/PapasWingeria/"},
{title:"Papas Pancakeria",url:"https://3kh0s.github.io/games/papaspancakeria/index.html"},
{title:"Papas Sushiria",url:"https://3kh0s.github.io/games/papassushiria/index.html"},
{title:"Papas Pizzaria",url:"https://1kh0.github.io/projects/papaspizzaria/index.html"},
{title:"Papas Donuteria",url:"https://3kh0s.github.io/games/papasdonuteria/index.html"},
{title:"Papas Taco Mia",url:"https://3kh0s.github.io/games/papastacomia/index.html"}
]

const randomGames=[
{title:"Basket Random",url:"https://3kh0s.github.io/games/basketrandom/index.html"},
{title:"Soccer Random",url:"https://3kh0s.github.io/games/soccerrandom/index.html"},
{title:"Volleyball Random",url:"https://3kh0s.github.io/games/volleyrandom/index.html"},

]

/* ✅ FIXED HERE */
const cardGames=[
{title:"Solitaire",url:"https://zzymyn.github.io/SolitaireLib/"},
{title:"Poker",url:"https://goatedcoder360.github.io/poker/"},
{title:"Black Jack",url:"https://games-site.github.io/projects/blackjack/index.html"},
{title:"Fruit Slots",url:"https://goatedcoder360.github.io/fruitslots/"}
]

const soundButtons=[
{title:"Sound Buttons World",url:"https://soundbuttonsworld.com/"},
{title:"Sound Buttons Pro",url:"https://soundbuttonspro.net/"},
{title:"Myinstants",url:"https://www.myinstants.com/en/index/us/"},
{title:"Meme SoundBoard",url:"https://soundboardguys.com/"}
]

const appsLinks=[
{title:"Youtube",url:"https://goatedcoder360.github.io/youtube/"},
{title:"Calculator",url:"https://goatedcoder360.github.io/calculator/"},
{title:"Wordcount",url:"https://goatedcoder360.github.io/wordcount/"},
{title:"Copy + Change Pro",url:"https://goatedcoder360.github.io/copyandchangepro/"},
{title:"Other Website",url:"https://goatedcoder360.github.io/searcher-2/"}
]

function openFullScreenLink(url){
gameOpen=true
document.body.innerHTML=""

const iframe=document.createElement("iframe")
iframe.src=url
iframe.style.position="fixed"
iframe.style.top="0"
iframe.style.left="0"
iframe.style.width="100%"
iframe.style.height="100%"
iframe.style.border="none"

document.body.appendChild(iframe)
}

function renderCategory(title,list){
boredContainer.innerHTML=""

const back=document.createElement("div")
back.textContent="← Back"
back.className="backButton"
back.addEventListener("click",renderBoredMode)

boredContainer.appendChild(back)

const ul=document.createElement("ul")

list.forEach(link=>{
const li=document.createElement("li")
li.textContent=link.title
li.addEventListener("click",()=>openFullScreenLink(link.url))
ul.appendChild(li)
})

boredContainer.appendChild(ul)
}

function renderBoredMode(){
boredContainer.innerHTML="<ul></ul>"
const ul=boredContainer.querySelector("ul")

boredLinks.forEach(link=>{
const li=document.createElement("li")
li.textContent=link.title

if(link.isCategory==="io") li.onclick=()=>renderCategory(".io Games",ioGames)
else if(link.isCategory==="papas") li.onclick=()=>renderCategory("Papa's Games",papasGames)
else if(link.isCategory==="sounds") li.onclick=()=>renderCategory("Sound Buttons",soundButtons)
else if(link.isCategory==="apps") li.onclick=()=>renderCategory("Apps",appsLinks)
else if(link.isCategory==="random") li.onclick=()=>renderCategory("Random Games",randomGames)
else if(link.isCategory==="brain") li.onclick=()=>renderCategory("Brain Games",brainGames)
else if(link.isCategory==="cards") li.onclick=()=>renderCategory("Card Games",cardGames)
else li.onclick=()=>openFullScreenLink(link.url)

ul.appendChild(li)
})
}

document.addEventListener("keydown",(e)=>{
if(e.key === "\\" && gameOpen){
if(confirm("Do you want to go back to the homescreen?")){
location.reload()
}
}
})

renderBoredMode()

</script>

</body>
</html>
